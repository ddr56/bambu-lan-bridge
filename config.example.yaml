# Copy to data/config.yaml, or just add printers on the admin page. One entry per printer.
data_dir: /data            # proxy-tls/ and certs/ live here
ssdp: true                 # announce the virtual printers on the LAN so clients find them
mode: full                 # full: sign and forward print.* commands; read_only: status only
# present_developer_mode: true  # full mode: tell clients the printer is in LAN developer mode,
#                          # so they send plain commands that the proxy signs
admin_port: 8099           # admin page; password from ADMIN_PASSWORD or data/admin_password
# admin_bind: 127.0.0.1    # loopback only: no password, reachable from this host only
# certs_dir: /data/certs   # key.pem, chain.pem, crl.pem -- upload them on the admin page

printers:
  - serial: 00M00A000000000      # your printer's serial, from its label
    name: My Printer
    model_code: O1D              # from the printer's SSDP: H2D O1D, H2C O1C2, P1S C12, X1C BL-P001 ...
    virtual_ip: 192.168.1.60     # a free address on your LAN for the proxy to present this printer on
    lan_ip: 192.168.1.50         # the printer's real IP
    access_code: "00000000"      # the printer's access code (printer screen); clients use it too
